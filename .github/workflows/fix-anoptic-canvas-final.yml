name: Final Anoptic canvas factual pass

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-anoptic-canvas-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-backed corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("seeds/canvases/anoptic-api-algebra-2026-08-17.tsx")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"replacement precondition failed: expected {expected}, "
                      f"found {observed} for {old[:160]!r}"
                  )
              text = text.replace(old, new)

          replacements = [
              (
                  '  { id: "result", label: "Result(V, E)", detail: "one value, two ways", mono: true, emphasis: true },\n  { id: "function", label: "Function", detail: "a callable that returns that", mono: true },',
                  '  { id: "result", label: "Result(V, E)", detail: "one active alternative", mono: true, emphasis: true },\n  { id: "function", label: "ResultMorphism", detail: "a Function whose call returns Result", mono: true },',
              ),
              (
                  """          inhabitant exists. Success containing Value, or failure containing
          Error. Never both. Never neither.""",
                  """          alternative is active: success containing Value (or no payload when
          Value is void), or failure containing Error. Never both. Never
          neither.""",
              ),
              (
                  '              "Admissible error",\n              "Moving the error cannot throw. Failure is not allowed to become a third control path.",',
                  '              "Admitted Anoptic error",\n              "Helpers and morphism concepts require ResultError; the bare Result alias does not.",',
              ),
              (
                  '              "Nothrow move",\n              "The error is moved in. ResultError already required that.",',
                  '              "Nothrow construction",\n              "StoredError is constructed from the forwarded argument without throwing; ResultError separately requires nothrow move construction.",',
              ),
              (
                  """          proved that the operation returns an ordinary value rather than a
          Result.""",
                  """          proved that the operation's return type is not a Result. That return
          may be an object type or void.""",
              ),
              (
                  '["Returns an ordinary value, not a Result", "No IO"],',
                  '["Returns a non-Result type, possibly void", "No IO"],',
              ),
              (
                  """          structure-preserving map from A to B. In C the closest habit is
          just "a function from A to B." fopen is FILE* fopen(path). You
          give a path, you get a pointer. The failure, if you remember to
          look, is a null on the side.""",
                  """          structure-preserving map from A to B. In C the closest habit is
          just "a function from A to B." A familiar example is
          `FILE *fopen(filename, mode)`: the input pair maps to a pointer,
          with failure represented by a null pointer.""",
              ),
              (
                  '["C function", "A to B. Failure is null, errno, or a write to an out-param."],',
                  '["C convention", "A to B at the type level; failure may be encoded by a sentinel, status/errno convention, or out-parameter protocol."],',
              ),
              (
                  '              "m : B to C, ordinary return. DirectOperation, not a Result. May still mutate the world.",',
                  '              "For non-void B, m : B to C; for void success it may be nullary. Its return is not a Result, and it may still mutate the world.",',
              ),
              (
                  '              "(state, item) to Result of state. Same E as the scan\'s source.",',
                  '              "(state, item) to Result of state. Its Error must match the Error supplied by the enclosing scan constraint.",',
              ),
              (
                  """          `sizeof`. There is no type erasure or vtable; a direct call and
          inlining are optimization opportunities, not size guarantees.""",
                  """          `sizeof`. Function itself adds no type-erasure or virtual-dispatch
          layer. Whether Operation performs virtual dispatch is a property of
          Operation itself; inlining remains an optimizer decision.""",
              ),
              (
                  '              "The Operation is in the type. No void*, no type erasure, no vtable.",',
                  '              "The Operation is in the type. Function adds no type-erasure or virtual-dispatch layer.",',
              ),
              (
                  """          algebra ran at compile time. The work runs now.""",
                  """          C++ constraints were checked at compile time; the Lean laws were
          proved separately. The wrapped work runs now.""",
              ),
              (
                  '        <CodeBlock>{`template<class Operation>\nusing ResultMorphism = Function<Operation>;`}</CodeBlock>',
                  '        <CodeBlock>{`template<ResultOperation Operation>\nusing ResultMorphism = Function<Operation>;`}</CodeBlock>',
              ),
              (
                  '              "Zero storage",\n              "The lifted operation is empty. The standalone Function is still nonzero-sized; its direct call may inline to parse_glb.",',
                  '              "Empty operation",\n              "The lifted operation is empty. The standalone Function is still nonzero-sized; its direct call may inline to parse_glb.",',
              ),
              (
                  '              "Variadic is repeated pair",\n              "pair(a, b, c) is pair(pair(a, b), c), reassociated. Same machine.",',
                  '              "Variadic is a left fold",\n              "pair(a, b, c) is implemented as pair(pair(a, b), c), yielding std::pair<std::pair<A, B>, C>.",',
              ),
              (
                  '              "Concrete variadic order",\n              "The implementation left-nests pair(a, b, c) as ((A, B), C) and invokes a, b, then c. Different nesting changes the tuple type.",',
                  '              "Evaluation order",\n              "The left fold invokes a, then b, then c; the first failure stops the remainder.",',
              ),
              (
                  """          implementation still has to prove that a whole parameter pack can
          be paired, one adjacent pair at a time. That predicate stays""",
                  """          implementation still has to prove that a whole parameter pack can
          be paired by the same left fold used by pair_impl. That predicate
          stays""",
              ),
              (
                  '          <H3>ANO_LET(name, operation)</H3>',
                  '          <H3>ANO_LET(name, ...)</H3>',
              ),
              (
                  """          A local name for a Function. Scope-local, namespace-respecting.
          Conceptually it is const auto name = ano::function(...). The
          macro exists because the declaration grammar is awkward once
          reflection splices and long chains get involved. It does not
          typecheck. Concepts, reflection, and the concrete Function type
          still do that.""",
                  """          A thin declaration macro. It expands to
          `const auto name = ::ano::function(__VA_ARGS__)`; the surrounding
          scope determines where the name lives. The macro does not perform
          typechecking itself. Concepts, reflection, and Function do that.""",
              ),
              (
                  '              "Local",\n              "A name in this scope. Not a global registry. Not a string key.",',
                  '              "Ordinary declaration",\n              "The name lives wherever the macro expands. It is not a registry or string key.",',
              ),
              (
                  '        <CodeBlock>{`const auto load_scene = ano::function(...);`}</CodeBlock>',
                  '        <CodeBlock>{`const auto load_scene = ::ano::function(...);`}</CodeBlock>',
              ),
          ]

          for old, new in replacements:
              replace_exact(old, new)

          banned = [
              'detail: "one value, two ways"',
              'label: "Function", detail: "a callable that returns that"',
              "inhabitant exists. Success containing Value",
              '"Admissible error"',
              '"Nothrow move"',
              "fopen is FILE* fopen(path)",
              "No void*, no type erasure, no vtable",
              "algebra ran at compile time",
              "template<class Operation>\\nusing ResultMorphism",
              '"Zero storage"',
              "reassociated. Same machine.",
              "one adjacent pair at a time",
              "ANO_LET(name, operation)",
              "Scope-local, namespace-respecting",
          ]
          for phrase in banned:
              if phrase in text:
                  raise SystemExit(f"stale factual phrase remains: {phrase!r}")

          if text == original:
              raise SystemExit("patch made no changes")

          path.write_text(text, encoding="utf-8")
          print(f"updated {path}: {len(original)} -> {len(text)} bytes")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Build corrected canvas browser
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-anoptic-canvas-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            seeds/canvases/anoptic-api-algebra-2026-08-17.tsx \
            .github/workflows/fix-anoptic-canvas-final.yml
          if git diff --cached --quiet; then
            echo "No correction staged" >&2
            exit 1
          fi
          git commit -m "docs: finish Anoptic API factual audit"
          git push origin HEAD:main
