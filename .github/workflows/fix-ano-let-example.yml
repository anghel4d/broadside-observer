name: Correct ANO_LET example

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-ano-let-example.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact correction
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("seeds/canvases/anoptic-api-algebra-2026-08-17.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '"function(...) still requires an admitted callable. The macro cannot smuggle a thrower.",',
                  '"function(...) requires an underlying admitted callable. In this snapshot, an already-built Function or ResultMorphism is not accepted by the callable inspector.",',
              ),
              (
                  '<CodeBlock>{`ANO_LET(load_scene,\n    ano::lift<^^parse_glb>\n        .and_then(canonicalize_scene)\n        .and_then(cook_scene)\n        .and_then(realize_scene));`}</CodeBlock>',
                  '<CodeBlock>{`ANO_LET(parse_scene, &parse_glb);`}</CodeBlock>',
              ),
              (
                  '<CodeBlock>{`const auto load_scene = ::ano::function(...);`}</CodeBlock>',
                  '<CodeBlock>{`const auto parse_scene = ::ano::function(&parse_glb);`}</CodeBlock>',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new)

          banned = [
              "ANO_LET(load_scene,",
              "const auto load_scene = ::ano::function(...);",
              "The macro cannot smuggle a thrower.",
          ]
          for phrase in banned:
              if phrase in text:
                  raise SystemExit(f"stale phrase remains: {phrase!r}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Build corrected canvas browser
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-ano-let-example.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            seeds/canvases/anoptic-api-algebra-2026-08-17.tsx \
            .github/workflows/fix-ano-let-example.yml
          git commit -m "docs: correct ANO_LET usage example"
          git push origin HEAD:main
