name: Finalize and deploy Anoptic canvas audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-and-deploy-anoptic-canvas.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final source-backed corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("seeds/canvases/anoptic-api-algebra-2026-08-17.tsx")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"replacement precondition failed: expected {expected}, "
                      f"found {observed} for {old[:180]!r}"
                  )
              text = text.replace(old, new)

          replacements = [
              (
                  "alternative is active: success containing Value (or no payload when Value is void), or failure containing Error. Never both. Never neither.",
                  "alternative is active: success containing Value (or no payload when\n          Value is void), or failure containing Error. Never both. Never\n          neither.",
              ),
              (
                  "proved that the operation's return type is not a Result; that return may be an object type or void.",
                  "proved only that the return is not a Result. DirectOperation itself\n          permits object, void, or reference returns; stronger public\n          concepts add their own return constraints.",
              ),
              (
                  '["Returns a non-Result type, possibly void", "No IO"],',
                  '["Return is not a Result; object, void, or reference are possible", "No IO"],',
              ),
              (
                  'structure-preserving map from A to B. In C the closest habit is just "a function from A to B." A familiar example is `FILE *fopen(filename, mode)`: the input pair maps to a pointer, with failure represented by a null pointer.',
                  'structure-preserving map from A to B. In C the closest habit is\n          just "a function from A to B." A familiar example is\n          `FILE *fopen(filename, mode)`: the input pair maps to a pointer,\n          with failure represented by a null pointer.',
              ),
              (
                  '"(state, item) to Result of state. Its Error must match the Error supplied by the enclosing scan constraint."',
                  '"(state, item) to Result of state. Its Error is the concept\'s Error template argument; Scannable supplies the source operation\'s Error."',
              ),
              (
                  "`sizeof`. Function itself adds no type-erasure or virtual-dispatch layer. Whether Operation performs virtual dispatch is a property of Operation itself; inlining remains an optimizer decision.",
                  "`sizeof`. Function itself adds no type-erasure or virtual-dispatch\n          layer. Whether Operation performs virtual dispatch is a property of\n          Operation itself; inlining remains an optimizer decision.",
              ),
              (
                  '"You do not brace-initialize one by hand. lift, function, and the composition methods are the doors."',
                  '"You do not brace-initialize one by hand. lift, function, pair, and the composition methods are the public doors."',
              ),
              (
                  '"Moving the operation into the Function cannot throw. Same rule as ResultError, now for the callable."',
                  '"Construction from the supplied operation and the stored operation\'s move construction must both be noexcept."',
              ),
              (
                  "C++ constraints were checked at compile time; the Lean laws were proved separately. The wrapped work runs now.",
                  "C++ constraints were checked at compile time; the Lean laws were\n          proved separately. The wrapped work runs now.",
              ),
              (
                  '"Moving the operation in cannot throw."',
                  '"Construction from the supplied value and the stored operation\'s move construction must both be noexcept."',
              ),
              (
                  '"The left fold invokes a, then b, then c; the first failure stops the remainder."',
                  '"When the returned Function is called, the left fold invokes a, then b, then c; the first failure stops the remainder."',
              ),
              (
                  "implementation still has to prove that a whole parameter pack can be paired by the same left fold used by pair_impl. That predicate stays",
                  "implementation still has to prove that a whole parameter pack can\n          be paired by the same left fold used by pair_impl. That predicate\n          stays",
              ),
              (
                  "A thin declaration macro. It expands to `const auto name = ::ano::function(__VA_ARGS__)`; the surrounding scope determines where the name lives. The macro does not perform typechecking itself. Concepts, reflection, and Function do that.",
                  "A thin declaration macro. It expands to\n          `const auto name = ::ano::function(__VA_ARGS__)`; the surrounding\n          scope determines where the name lives. The macro does not perform\n          typechecking itself. Concepts, reflection, and Function do that.",
              ),
              (
                  '["ANO_LET", "macro, local, grammar", "Public"],',
                  '["ANO_LET", "macro, declaration, grammar", "Public"],',
              ),
          ]

          for old, new in replacements:
              replace_exact(old, new)

          banned = [
              "may be an object type or void",
              "Returns a non-Result type, possibly void",
              "enclosing scan constraint",
              "Same rule as ResultError, now for the callable",
              "Moving the operation in cannot throw",
              "macro, local, grammar",
          ]
          for phrase in banned:
              if phrase in text:
                  raise SystemExit(f"stale factual phrase remains: {phrase!r}")

          if text == original:
              raise SystemExit("patch made no changes")

          path.write_text(text, encoding="utf-8")
          print(f"updated {path}: {len(original)} -> {len(text)} bytes")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build corrected canvas browser
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: seeds/app/dist

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-and-deploy-anoptic-canvas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            seeds/canvases/anoptic-api-algebra-2026-08-17.tsx \
            .github/workflows/fix-and-deploy-anoptic-canvas.yml
          if git diff --cached --quiet; then
            echo "No correction staged" >&2
            exit 1
          fi
          git commit -m "docs: complete Anoptic API factual corrections"
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy corrected canvas to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
