name: Remove final Anoptic canvas copy blemish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-anoptic-canvas-copy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated word
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("seeds/canvases/anoptic-api-algebra-2026-08-17.tsx")
          text = path.read_text(encoding="utf-8")
          pattern = r"inputs same outputs\. This concept proved none of that\. It only\s+proved only that the return is not a Result\. DirectOperation itself"
          replacement = "inputs same outputs. This concept proved none of that. It\n          proved only that the return is not a Result. DirectOperation itself"
          text, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f"expected one duplicate phrase, found {count}")
          if "It only\n          proved only" in text or "proved only that the return" not in text:
              raise SystemExit("copy correction postcondition failed")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: seeds/app/dist

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-anoptic-canvas-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            seeds/canvases/anoptic-api-algebra-2026-08-17.tsx \
            .github/workflows/fix-anoptic-canvas-copy.yml
          git commit -m "docs: remove duplicated word from Anoptic canvas"
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy final canvas
        id: deployment
        uses: actions/deploy-pages@v5
