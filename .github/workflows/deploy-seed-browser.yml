name: One-shot Anoptic canvas factual correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-seed-browser.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          cat .github/fix-anoptic-canvas.part1.py .github/fix-anoptic-canvas.part2.py > /tmp/fix-anoptic-canvas.py
          python -m py_compile /tmp/fix-anoptic-canvas.py
          python /tmp/fix-anoptic-canvas.py
          rm -f \
            .github/fix-anoptic-canvas.py.gz.b64 \
            .github/fix-anoptic-canvas.part1.py \
            .github/fix-anoptic-canvas.part2.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Build canvas browser
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Commit corrected canvas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            seeds/canvases/anoptic-api-algebra-2026-08-17.tsx \
            .github/fix-anoptic-canvas.py.gz.b64 \
            .github/fix-anoptic-canvas.part1.py \
            .github/fix-anoptic-canvas.part2.py
          if git diff --cached --quiet; then
            echo "No canvas changes staged" >&2
            exit 1
          fi
          git commit -m "docs: correct anoptic API algebra facts"
          git push origin HEAD:main
