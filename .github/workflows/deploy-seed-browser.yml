name: One-shot Anoptic canvas factual correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-seed-browser.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward and apply audited corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          printf '%s' '' | base64 -d | gzip -d > /tmp/fix_anoptic_canvas.py
          python /tmp/fix_anoptic_canvas.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seeds/app/package-lock.json

      - name: Build canvas browser
        working-directory: seeds/app
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Commit corrected canvas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seeds/canvases/anoptic-api-algebra-2026-08-17.tsx
          if git diff --cached --quiet; then
            echo "No canvas changes staged" >&2
            exit 1
          fi
          git commit -m "docs: correct anoptic API algebra facts"
          git push origin HEAD:main
