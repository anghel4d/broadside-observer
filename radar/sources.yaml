# Version-controlled source registry for the Broadside Observer research loop.
# Poll each enabled source; adapters may be manual/agent-operated until automated.
# Daypart bias is in radar/dayparts.yaml (frontier/craft/curiosity/archive).
sources:
- id: arxiv
  name: arXiv
  kind: preprint_api
  url: https://arxiv.org
  poll: https://export.arxiv.org/api/query
  categories:
  - cs.AI
  - cs.LG
  - cs.CL
  - cs.GR
  - cs.PL
  - cs.DC
  - cs.SE
  - cs.CV
  - cs.MA
  - cs.GT
  notes: Primary wide net. Combine category filters with topic query hints.
  priority: high
  enabled: true
- id: hf-daily-papers
  name: Hugging Face Daily Papers
  kind: curated_feed
  url: https://huggingface.co/papers
  notes: Daily curated ML/AI shortlist; strong signal, smaller volume than raw arXiv.
  priority: high
  enabled: true
- id: openreview
  name: OpenReview
  kind: conference_preprint
  url: https://openreview.net
  venues:
  - ICLR
  - NeurIPS
  - ICML
  - ACL
  notes: Preprints plus reviews for major ML/NLP venues.
  priority: high
  enabled: true
- id: acm-siggraph-tog
  name: ACM SIGGRAPH / TOG
  kind: venue
  url: https://www.siggraph.org
  also:
  - https://dl.acm.org/journal/tog
  notes: Flagship computer graphics and interactive techniques.
  priority: high
  enabled: true
- id: eurographics-cgf
  name: Eurographics / Computer Graphics Forum
  kind: venue
  url: https://www.eg.org
  notes: Graphics systems, rendering, geometry processing.
  priority: high
  enabled: true
- id: hpg-jcgt
  name: High-Performance Graphics + JCGT
  kind: venue
  url: https://www.highperformancegraphics.org
  also:
  - https://jcgt.org
  notes: Real-time and systems graphics; practical engine-relevant techniques. JCGT also listed first-class as `jcgt`.
  priority: high
  enabled: true
- id: acm-sigplan-dblp
  name: ACM SIGPLAN + DBLP (PL)
  kind: venue_index
  url: https://www.sigplan.org
  also:
  - https://dblp.org
  venues:
  - PLDI
  - POPL
  - ICFP
  - SPLASH
  notes: Programming languages, compilers, and runtimes for ano and engine scripting.
  priority: high
  enabled: true
- id: acl-anthology
  name: ACL Anthology
  kind: venue_archive
  url: https://aclanthology.org
  notes: NLP, dialogue, computational linguistics — ano grammar angle and GRID COMMAND NL orders.
  priority: high
  enabled: true
- id: papers-with-code
  name: Papers with Code
  kind: code_linked_index
  url: https://paperswithcode.com
  notes: New code-linked papers; useful systems/reproducibility signal layered on arXiv.
  priority: medium
  enabled: true
- id: aiide-ieee-cog
  name: AIIDE / IEEE CoG
  kind: venue
  url: https://www.aiide.org
  also:
  - https://ieee-cog.org
  notes: Game AI, RTS/strategy agents, simulation opponents, procedural content.
  priority: high
  enabled: true
- id: deepseek-research
  name: DeepSeek Research
  kind: lab
  url: https://github.com/deepseek-ai
  also:
  - https://huggingface.co/deepseek-ai
  - https://arxiv.org/search/?searchtype=author&query=DeepSeek-AI
  notes: First-party DeepSeek-AI technical reports (LLM, MoE, Coder, Math/GRPO, V2 MLA, V3, R1, V3.2 DSA, V4, Fire-Flyer HPC, NSA, VL/Janus). Prefer author=DeepSeek-AI over papers merely citing them.
  priority: high
  enabled: true
- id: google-deepmind
  name: Google DeepMind
  kind: lab
  url: https://deepmind.google/research/publications/
  also:
  - https://arxiv.org/search/?searchtype=author&query=Google+DeepMind
  notes: DeepMind / Google DeepMind publications (Gemini, Alpha*, Gato, AlphaFold, and serving/systems papers). Lab feed, not a dump of every Google paper.
  priority: high
  enabled: true
- id: openai-research
  name: OpenAI
  kind: lab
  url: https://openai.com/research/
  also:
  - https://arxiv.org/search/?searchtype=author&query=OpenAI
  notes: OpenAI research index and first-party arXiv (GPT, o-series, Whisper, CLIP, system cards). Author/org OpenAI, not third-party evals.
  priority: high
  enabled: true
- id: xai-labs
  name: xAI
  kind: lab
  url: https://x.ai
  also:
  - https://arxiv.org/search/?query=xAI&searchtype=all
  notes: xAI lab papers and technical reports (Grok family, Colossus, first-party evals). Sparse compared with the other three; still poll.
  priority: high
  enabled: true
- id: jcgt
  name: Journal of Computer Graphics Techniques
  kind: venue
  url: https://jcgt.org
  also:
  - https://www.jcgt.org
  - https://jcgt.org/published/
  - https://jcgt.org/read.html
  notes: Open-access practical CG techniques journal (ISSN 2331-7418). Poll new issues / published TOC. Distinct from the HPG half of hpg-jcgt.
  priority: high
  enabled: true
- id: eg-diglib-vmv
  name: Eurographics Digital Library / VMV
  kind: venue
  url: https://diglib.eg.org
  also:
  - https://diglib.eg.org/handle/10.2312
  - Vision Modeling Visualization
  notes: EG workshop/conference archive (VMV, EGSR siblings, workshops) beyond CGF. Poll diglib for new VMV + EG workshop items.
  priority: high
  enabled: true
cross_index:
- id: semantic-scholar
  name: Semantic Scholar
  url: https://www.semanticscholar.org
  role: search_and_resolve
secondary_sources:
- id: vector-journal-apl
  name: Vector (APL/BQN community) + array-language blogs
  kind: community
  url: https://vector.org.uk
  notes: Array-language craft and history for ano lineage.
  enabled: true
- id: jfp-icfp-archive
  name: JFP / ICFP archival track
  kind: venue
  url: https://www.cambridge.org/core/journals/journal-of-functional-programming
  notes: PLT and typed FP archive depth for daypart archive/craft.
  enabled: true
- id: arxiv-math-ct
  name: arXiv math.CT
  kind: preprint_category
  url: https://arxiv.org/list/math.CT/recent
  notes: Category theory feed for curiosity + archive + PLT bridges.
  enabled: true
